name: BuildCore CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BuildCore (\${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore BuildCore.sln

      - name: Build
        run: dotnet build BuildCore.sln --configuration \${{ matrix.configuration }} --platform x64 --no-restore

      - name: Verify build output
        shell: pwsh
        run: |
          \$output = Get-ChildItem -Path . -Recurse -Filter BuildCore.exe -ErrorAction SilentlyContinue |
            Where-Object { \$_.FullName -match '\\bin\\x64\\' } |
            Select-Object -First 1

          if (\$null -eq \$output) {
            Write-Error "BuildCore.exe was not produced by the x64 build."
            exit 1
          }

          Write-Host "Build output: \$($output.FullName)"
